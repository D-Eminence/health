<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Patient screens are private: never let a search engine or a preview crawler index one. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- The Health ID mark in the tab and on a phone's home screen: files in public/, served as they are. The
         colour is the brand colour of the design tokens (packages/ui/src/tokens.css). -->
    <meta name="theme-color" content="#1570ef" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/health-id.webmanifest" />
    <title>Health ID: Patient</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
