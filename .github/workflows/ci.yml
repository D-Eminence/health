name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, phase-1-patient-core, phase-2-provider-reconciliation, phase-3-patient-safety]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Architecture checks run first: a boundary violation is a design problem,
      # and there is no point typechecking past one.
      - name: Architecture boundaries
        run: npm run audit:boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Builds use placeholder local configuration. No staging or production
      # gateway address is available to CI, and CI never points at production.
      - name: Build applications
        env:
          NEXT_PUBLIC_HID_ENVIRONMENT: local
          NEXT_PUBLIC_HID_API_BASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_HID_APP_ORIGIN: http://localhost:3100
          VITE_HID_ENVIRONMENT: local
          VITE_HID_API_BASE_URL: http://127.0.0.1:54321
          VITE_HID_APP_ORIGIN: http://localhost:3200
        run: |
          npm run build:patient-web
          npm run build:public-web

      # hid-system's staging step refuses a portal build with Google sign-in,
      # a service worker, a manifest, a source map or an unexpected file. This
      # build has no Google client ID, as at launch.
      - name: Launch build check
        run: npm run audit:launch-build

      # The same check on a build with the offline app shell (docs/OFFLINE-CONTRACT.md 2.12-2.13): an EHR/Migrate
      # pilot build writes the shell's file list into sw.js, which the build above (offline off) leaves null. Local
      # placeholder configuration as above, so no Google client ID and nothing points at production.
      - name: Launch build check (offline pilot shell)
        env:
          VITE_HID_ENVIRONMENT: local
          VITE_HID_API_BASE_URL: http://127.0.0.1:54321
          VITE_HID_APP_ORIGIN: http://localhost:3200
          VITE_HID_OFFLINE_MODE: pilot
          VITE_HID_OFFLINE_HOSTS: ehr,ocr
          VITE_HID_OFFLINE_FACILITIES: 98d00002-0000-4000-8000-000000000001
          VITE_HID_OFFLINE_DEBUG: 'false'
        run: |
          rm -rf apps/patient-web/dist
          npm run build:patient-web
          grep -q '^self.__HID_SHELL__ = {' apps/patient-web/dist/sw.js
          npm run audit:launch-build

      - name: Dependency audit
        run: npm audit --audit-level=high
