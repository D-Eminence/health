name: Production frontend candidates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PRODUCTION_APPROVAL_MODE: ${{ vars.PRODUCTION_APPROVAL_MODE || 'protected' }}
concurrency:
  group: production-frontend-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      candidate_sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci
      - name: Validate production source and host boundaries
        run: |
          npm run audit:boundaries
          npm run check
          npm run test:edge
          npm run test:release
          npm run test:production-release
          python -m unittest discover -s scripts -p 'test_production_deployment*.py'
          npm audit --audit-level=high
      - name: Build immutable production frontend candidates
        run: npm run build:production
      - name: Compile Workers without deployment
        run: python scripts/prepare-production-workers.py
      - name: Prepare exact production approval report
        id: candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository_id == '1428636965'
        run: python scripts/deploy-production-workers.py candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository_id == '1428636965'
        with:
          name: production-frontend-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/candidate.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-frontends-${{ github.sha }}
          path: |
            build/production/*.zip
            build/production/manifest.json
            build/production/worker-preparation.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  deploy:
    needs: build
    if: vars.PRODUCTION_DEPLOYMENT_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository_id == '1428636965'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production-frontend
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      PRODUCTION_DEPLOYMENT_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
      EXPECTED_CANDIDATE_SHA256: ${{ needs.build.outputs.candidate_sha256 }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
      RELEASE_KMS_KEY_ARN: ${{ vars.RELEASE_KMS_KEY_ARN }}
      RELEASE_LEASE_TABLE: hid-staging-deployment-leases
      RELEASE_ALERT_TOPIC_ARN: arn:aws:sns:eu-west-1:659225405023:hid-staging-operations-alerts
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-frontend-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Verify deployment policy and exact candidate
        run: python scripts/verify-production-approval.py release/candidate.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-frontends-${{ github.sha }}
          path: build/production
      - name: Locked Worker tooling
        run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          allowed-account-ids: '659225405023'
          role-duration-seconds: 7200
          unset-current-credentials: true
      - name: Load scoped Cloudflare deployment token from AWS
        run: python scripts/load-production-cloudflare-token.py
      - name: Deploy exact Worker versions and verify or roll back
        run: python scripts/deploy-production-workers.py deploy
