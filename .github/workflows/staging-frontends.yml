name: Staging frontend artifacts

# Staging artifacts are published by hand (docs/STAGING_DEPLOYMENT.md), so they are built on request and for a
# staging-frontend-* branch. Pull requests and main are checked by ci.yml and built by production-frontends.yml, so a
# pull request builds staging only when it changes an input that only the staging build reads: the staging
# configuration, the staging build and Worker scripts, the environment switch, or this workflow.
# Root documentation only is ignored on push (never **/*.md: some tests import Markdown that sits next to the code).
on:
  push:
    branches: ['staging-frontend-*']
    paths-ignore: ['docs/**', 'README.md', 'PLAN.md', 'BACKEND-NEEDS.md']
  pull_request:
    branches: [main]
    paths:
      - 'config/staging.json'
      - 'scripts/build-staging.py'
      - 'scripts/prepare-staging-workers.py'
      - 'scripts/staging_release.py'
      - 'packages/config/src/environment.ts'
      - '.github/workflows/staging-frontends.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-frontends-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Locked dependencies
        run: npm ci
      - name: Frontend checks
        run: |
          npm run audit:boundaries
          npm run check
          npm run test:edge
          npm run test:release
          npm run test:audit-gate
          npm run audit:dependencies
      - name: Build every staging frontend using public configuration
        run: npm run build:staging
      - name: Validate compiled Workers without deploying
        run: python scripts/prepare-staging-workers.py --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-frontends-${{ github.sha }}
          path: |
            build/staging/*.zip
            build/staging/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: staging-frontend-diagnostics-${{ github.run_id }}
          path: build/staging/*.log
          if-no-files-found: ignore
          retention-days: 7
