<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 624" width="1760" height="624" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="ah"/></marker></defs><text class="title" x="24" y="32" text-anchor="start">Hospital lifecycle: verification, setup and subscription</text><text class="sub" x="24" y="52" text-anchor="start">States and transitions come from the facility, onboarding and subscription code, not from the screens alone.</text><rect class="lane-bg" x="12" y="74" width="1736" height="150" rx="12"/><text class="lane" x="26" y="94">Facility verification</text><rect class="n n-pub" x="40" y="110" width="200" height="84" rx="8"/><text class="t" x="140" y="130" text-anchor="middle">Submitted</text><text class="s" x="140" y="145" text-anchor="middle">Registration saved with 3</text><text class="s" x="140" y="158" text-anchor="middle">agreements</text><rect class="n n-gate" x="300" y="110" width="200" height="84" rx="8"/><text class="t" x="400" y="130" text-anchor="middle">Pending verification</text><text class="s" x="400" y="145" text-anchor="middle">Email verified. Clinical</text><text class="s" x="400" y="158" text-anchor="middle">modules locked</text><rect class="n n-ws" x="560" y="110" width="200" height="84" rx="8"/><text class="t" x="660" y="130" text-anchor="middle">Verified</text><text class="s" x="660" y="145" text-anchor="middle">Platform reviewer approves with</text><text class="s" x="660" y="158" text-anchor="middle">a reason. Trial starts once</text><rect class="n n-bad" x="820" y="110" width="200" height="84" rx="8"/><text class="t" x="920" y="130" text-anchor="middle">Rejected</text><text class="s" x="920" y="145" text-anchor="middle">Owner edits details and</text><text class="s" x="920" y="158" text-anchor="middle">resubmits</text><rect class="n n-bad" x="1080" y="110" width="200" height="84" rx="8"/><text class="t" x="1180" y="130" text-anchor="middle">Suspended</text><text class="s" x="1180" y="145" text-anchor="middle">Platform action available to</text><text class="s" x="1180" y="158" text-anchor="middle">reviewers</text><path class="e" d="M240,152 L300,152" marker-end="url(#ah)"/><path class="e" d="M500,152 L560,152" marker-end="url(#ah)"/><path class="e e-dash" d="M400,110 L400,96 L920,96 L920,110" marker-end="url(#ah)"/><text class="el" x="660" y="105" text-anchor="middle">Rejected</text><path class="e e-dash" d="M920,194 L920,212 L400,212 L400,194" marker-end="url(#ah)"/><text class="el" x="660" y="208" text-anchor="middle">Resubmit</text><text class="sub" x="1300" y="160" text-anchor="start">Reviewer states: Verified, Rejected, Pending review, Suspended.</text><rect class="lane-bg" x="12" y="244" width="1736" height="118" rx="12"/><text class="lane" x="26" y="264">Operational setup (9 steps, resumes where you stopped)</text><rect class="n n-ws" x="36" y="290" width="160" height="44" rx="8"/><text class="t" x="116" y="316" text-anchor="middle">1. Facility</text><rect class="n n-ws" x="228" y="290" width="160" height="44" rx="8"/><text class="t" x="308" y="316" text-anchor="middle">2. Type</text><rect class="n n-ws" x="420" y="290" width="160" height="44" rx="8"/><text class="t" x="500" y="316" text-anchor="middle">3. Departments</text><rect class="n n-ws" x="612" y="290" width="160" height="44" rx="8"/><text class="t" x="692" y="316" text-anchor="middle">4. Branches</text><rect class="n n-ws" x="804" y="290" width="160" height="44" rx="8"/><text class="t" x="884" y="316" text-anchor="middle">5. Staff</text><rect class="n n-ws" x="996" y="290" width="160" height="44" rx="8"/><text class="t" x="1076" y="316" text-anchor="middle">6. Roles</text><rect class="n n-ws" x="1188" y="290" width="160" height="44" rx="8"/><text class="t" x="1268" y="316" text-anchor="middle">7. Billing</text><rect class="n n-ws" x="1380" y="290" width="160" height="44" rx="8"/><text class="t" x="1460" y="316" text-anchor="middle">8. Review</text><rect class="n n-admin" x="1572" y="290" width="160" height="44" rx="8"/><text class="t" x="1652" y="316" text-anchor="middle">9. Launch</text><path class="e" d="M196,312 L228,312" marker-end="url(#ah)"/><path class="e" d="M388,312 L420,312" marker-end="url(#ah)"/><path class="e" d="M580,312 L612,312" marker-end="url(#ah)"/><path class="e" d="M772,312 L804,312" marker-end="url(#ah)"/><path class="e" d="M964,312 L996,312" marker-end="url(#ah)"/><path class="e" d="M1156,312 L1188,312" marker-end="url(#ah)"/><path class="e" d="M1348,312 L1380,312" marker-end="url(#ah)"/><path class="e" d="M1540,312 L1572,312" marker-end="url(#ah)"/><text class="sub" x="36" y="354" text-anchor="start">Launch is blocked until required items are valid. A new hospital starts empty: no patients, stock or transactions.</text><rect class="lane-bg" x="12" y="382" width="1736" height="224" rx="12"/><text class="lane" x="26" y="402">Facility subscription (simulated clock, no real payment)</text><rect class="n n-ws" x="40" y="420" width="210" height="84" rx="8"/><text class="t" x="145" y="440" text-anchor="middle">Trialing</text><text class="s" x="145" y="455" text-anchor="middle">21 days from verification</text><rect class="n n-gate" x="330" y="420" width="210" height="84" rx="8"/><text class="t" x="435" y="440" text-anchor="middle">Expiring soon</text><text class="s" x="435" y="455" text-anchor="middle">3 days or fewer left. Reminders</text><text class="s" x="435" y="468" text-anchor="middle">at 14, 7, 3, 1 days</text><rect class="n n-gate" x="620" y="420" width="210" height="84" rx="8"/><text class="t" x="725" y="440" text-anchor="middle">Grace period</text><text class="s" x="725" y="455" text-anchor="middle">21 more days. Full access,</text><text class="s" x="725" y="468" text-anchor="middle">reminder banner</text><rect class="n n-bad" x="910" y="420" width="210" height="84" rx="8"/><text class="t" x="1015" y="440" text-anchor="middle">Expired</text><text class="s" x="1015" y="455" text-anchor="middle">Records stay readable. New</text><text class="s" x="1015" y="468" text-anchor="middle">writes are blocked</text><rect class="n n-ws" x="40" y="548" width="1080" height="48" rx="8"/><text class="t" x="580" y="568" text-anchor="middle">Active</text><text class="s" x="580" y="583" text-anchor="middle">30 days per simulated renewal. Renewal is possible from any state above.</text><path class="e" d="M250,462 L330,462" marker-end="url(#ah)"/><path class="e" d="M540,462 L620,462" marker-end="url(#ah)"/><path class="e" d="M830,462 L910,462" marker-end="url(#ah)"/><path class="e e-dash" d="M145,504 L145,548" marker-end="url(#ah)"/><path class="e e-dash" d="M435,504 L435,548" marker-end="url(#ah)"/><path class="e e-dash" d="M725,504 L725,548" marker-end="url(#ah)"/><path class="e e-dash" d="M1015,504 L1015,548" marker-end="url(#ah)"/><text class="el" x="1023" y="530" text-anchor="start">Renew</text><text class="sub" x="1160" y="466" text-anchor="start">Only Hospital Owner, Hospital Admin and Billing Officer</text><text class="sub" x="1160" y="482" text-anchor="start">can open /subscription. Patient billing is separate.</text></svg>