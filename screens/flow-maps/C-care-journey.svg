<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 906" width="1760" height="906" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="ah"/></marker></defs><text class="title" x="24" y="32" text-anchor="start">Patient care journey across workspaces</text><text class="sub" x="24" y="52" text-anchor="start">Thick arrows are buttons that open the next workspace with the patient or record already filled in. Dashed arrows are automatic effects or reference fields.</text><rect class="lane-bg" x="12" y="74" width="1736" height="400" rx="12"/><text class="lane" x="26" y="94">Outpatient flow</text><rect class="n n-ws" x="36" y="120" width="200" height="58" rx="8"/><text class="t" x="136" y="140" text-anchor="middle">Patients</text><text class="s" x="136" y="155" text-anchor="middle">Register, MRN, health ID</text><rect class="n n-ws" x="36" y="230" width="200" height="58" rx="8"/><text class="t" x="136" y="250" text-anchor="middle">Appointments</text><text class="s" x="136" y="265" text-anchor="middle">Book, check in, reschedule</text><rect class="n n-ws" x="36" y="340" width="200" height="58" rx="8"/><text class="t" x="136" y="360" text-anchor="middle">Patient visits</text><text class="s" x="136" y="375" text-anchor="middle">Queue and visit status</text><rect class="n n-ws" x="330" y="285" width="200" height="58" rx="8"/><text class="t" x="430" y="305" text-anchor="middle">Triage &amp; Vitals</text><text class="s" x="430" y="320" text-anchor="middle">Nurse records vitals</text><rect class="n n-ws" x="330" y="395" width="200" height="58" rx="8"/><text class="t" x="430" y="415" text-anchor="middle">Consultation</text><text class="s" x="430" y="430" text-anchor="middle">Draft, then sign (typed SIGN)</text><rect class="n n-ws" x="640" y="110" width="200" height="58" rx="8"/><text class="t" x="740" y="130" text-anchor="middle">Laboratory</text><text class="s" x="740" y="145" text-anchor="middle">Collect, process, verify,</text><text class="s" x="740" y="158" text-anchor="middle">publish</text><rect class="n n-ws" x="640" y="210" width="200" height="58" rx="8"/><text class="t" x="740" y="230" text-anchor="middle">Radiology</text><text class="s" x="740" y="245" text-anchor="middle">Schedule, report, review,</text><text class="s" x="740" y="258" text-anchor="middle">publish</text><rect class="n n-ws" x="640" y="310" width="200" height="58" rx="8"/><text class="t" x="740" y="330" text-anchor="middle">Pharmacy</text><text class="s" x="740" y="345" text-anchor="middle">Review, dispense (partial or</text><text class="s" x="740" y="358" text-anchor="middle">full)</text><rect class="n n-ws" x="640" y="410" width="200" height="58" rx="8"/><text class="t" x="740" y="430" text-anchor="middle">Referral network</text><text class="s" x="740" y="445" text-anchor="middle">Send, accept, complete</text><rect class="n n-ws" x="950" y="310" width="200" height="58" rx="8"/><text class="t" x="1050" y="330" text-anchor="middle">Stock</text><text class="s" x="1050" y="345" text-anchor="middle">Batches decrease on dispense</text><rect class="n n-ws" x="1240" y="310" width="200" height="58" rx="8"/><text class="t" x="1340" y="330" text-anchor="middle">Procurement</text><text class="s" x="1340" y="345" text-anchor="middle">Approve, order, receive</text><rect class="n n-ws" x="330" y="120" width="200" height="58" rx="8"/><text class="t" x="430" y="140" text-anchor="middle">External record access</text><text class="s" x="430" y="155" text-anchor="middle">Consent request, patient</text><text class="s" x="430" y="168" text-anchor="middle">decision</text><rect class="n n-admin" x="950" y="110" width="200" height="58" rx="8"/><text class="t" x="1050" y="130" text-anchor="middle">Service catalogue</text><text class="s" x="1050" y="145" text-anchor="middle">Prices used on invoices</text><rect class="n n-ws" x="1240" y="110" width="200" height="58" rx="8"/><text class="t" x="1340" y="130" text-anchor="middle">Patient billing</text><text class="s" x="1340" y="145" text-anchor="middle">Issue, pay, refund, void</text><rect class="n n-ws" x="1240" y="210" width="200" height="58" rx="8"/><text class="t" x="1340" y="230" text-anchor="middle">Insurance &amp; claims</text><text class="s" x="1340" y="245" text-anchor="middle">Submit, decide, settle</text><rect class="n n-ws" x="1500" y="210" width="200" height="58" rx="8"/><text class="t" x="1600" y="230" text-anchor="middle">Policies</text><text class="s" x="1600" y="245" text-anchor="middle">Insurer cover per patient</text><path class="e e-strong" d="M236,149 L270,149 L270,149 L330,149" marker-end="url(#ah)"/><path class="e e-strong" d="M136,178 L136,230" marker-end="url(#ah)"/><path class="e e-dash" d="M136,288 L136,340" marker-end="url(#ah)"/><text class="el" x="146" y="318" text-anchor="start">Check in creates the visit</text><path class="e e-strong" d="M36,149 L22,149 L22,369 L36,369" marker-end="url(#ah)"/><text class="el" transform="rotate(-90 14 262)" x="14" y="262" text-anchor="middle">walk-in visit</text><path class="e e-strong" d="M236,369 L283,369 L283,314 L330,314" marker-end="url(#ah)"/><path class="e e-strong" d="M236,369 L290,369 L290,424 L330,424" marker-end="url(#ah)"/><path class="e e-dash" d="M430,343 L430,395" marker-end="url(#ah)"/><text class="el" x="440" y="373" text-anchor="start">notifies clinician</text><path class="e e-strong" d="M530,424 L590,424 L590,139 L640,139" marker-end="url(#ah)"/><path class="e e-strong" d="M530,424 L590,424 L590,239 L640,239" marker-end="url(#ah)"/><path class="e e-strong" d="M530,424 L590,424 L590,339 L640,339" marker-end="url(#ah)"/><path class="e e-strong" d="M530,424 L585,424 L585,439 L640,439" marker-end="url(#ah)"/><path class="e e-dash" d="M840,339 L950,339" marker-end="url(#ah)"/><path class="e e-dash" d="M1240,339 L1150,339" marker-end="url(#ah)"/><text class="el" x="1195" y="331" text-anchor="middle">new batch</text><path class="e e-dash" d="M1150,139 L1240,139" marker-end="url(#ah)"/><path class="e e-dash" d="M1340,168 L1340,210" marker-end="url(#ah)"/><path class="e e-dash" d="M1500,239 L1440,239" marker-end="url(#ah)"/><rect class="lane-bg" x="12" y="494" width="1736" height="230" rx="12"/><text class="lane" x="26" y="514">Admission (created from /inpatient/new or /icu/new for a registered patient)</text><rect class="n n-ws" x="36" y="540" width="200" height="58" rx="8"/><text class="t" x="136" y="560" text-anchor="middle">Inpatient</text><text class="s" x="136" y="575" text-anchor="middle">Admit, transfer, prepare,</text><text class="s" x="136" y="588" text-anchor="middle">discharge</text><rect class="n n-ws" x="36" y="630" width="200" height="58" rx="8"/><text class="t" x="136" y="650" text-anchor="middle">ICU</text><text class="s" x="136" y="665" text-anchor="middle">Same lifecycle with ICU beds</text><rect class="n n-ws" x="330" y="585" width="200" height="58" rx="8"/><text class="t" x="430" y="605" text-anchor="middle">Wards &amp; Beds</text><text class="s" x="430" y="620" text-anchor="middle">Bed turnover, maintenance</text><rect class="n n-ws" x="640" y="540" width="200" height="58" rx="8"/><text class="t" x="740" y="560" text-anchor="middle">Nursing observations</text><text class="s" x="740" y="575" text-anchor="middle">Vitals, medication, handover</text><rect class="n n-ws" x="640" y="630" width="200" height="58" rx="8"/><text class="t" x="740" y="650" text-anchor="middle">Nursing tasks</text><text class="s" x="740" y="665" text-anchor="middle">Start, complete, cancel</text><rect class="n n-admin" x="950" y="585" width="200" height="58" rx="8"/><text class="t" x="1050" y="605" text-anchor="middle">Ward configuration</text><text class="s" x="1050" y="620" text-anchor="middle">Wards that hold beds</text><path class="e e-dash" d="M136,598 L136,614 L330,614 L330,614" marker-end="url(#ah)"/><text class="el" x="244" y="608" text-anchor="start">allocates bed</text><path class="e e-dash" d="M136,630 L136,614 L330,614 L330,614" marker-end="url(#ah)"/><path class="e e-strong" d="M236,569 L640,569" marker-end="url(#ah)"/><path class="e e-strong" d="M236,659 L640,659" marker-end="url(#ah)"/><text class="el" x="260" y="561" text-anchor="start">Continue care</text><path class="e e-dash" d="M950,614 L530,614" marker-end="url(#ah)"/><text class="el" x="866" y="608" text-anchor="start">in ward</text><text class="el" x="1180" y="606" text-anchor="start">Discharge or transfer sets the bed to cleaning;</text><text class="el" x="1180" y="620" text-anchor="start">Wards &amp; Beds then records Complete bed turnover.</text><text class="el" x="870" y="566" text-anchor="start">Inpatient and ICU both offer Continue care to</text><text class="el" x="870" y="580" text-anchor="start">Nursing observations and Nursing tasks.</text><rect class="lane-bg" x="12" y="744" width="1736" height="150" rx="12"/><text class="lane" x="26" y="764">Specialty tracks and support services (each is its own record lifecycle, linked to a patient or to the hospital)</text><rect class="n n-ws" x="36" y="780" width="270" height="40" rx="8"/><text class="t" x="171" y="804" text-anchor="middle">Emergency</text><rect class="n n-ws" x="336" y="780" width="270" height="40" rx="8"/><text class="t" x="471" y="804" text-anchor="middle">Maternity</text><rect class="n n-ws" x="636" y="780" width="270" height="40" rx="8"/><text class="t" x="771" y="804" text-anchor="middle">Theatre &amp; Procedures</text><rect class="n n-ws" x="936" y="780" width="270" height="40" rx="8"/><text class="t" x="1071" y="804" text-anchor="middle">Dental</text><rect class="n n-ws" x="36" y="836" width="270" height="40" rx="8"/><text class="t" x="171" y="860" text-anchor="middle">Telemedicine</text><rect class="n n-ws" x="336" y="836" width="270" height="40" rx="8"/><text class="t" x="471" y="860" text-anchor="middle">Blood Bank</text><rect class="n n-ws" x="636" y="836" width="270" height="40" rx="8"/><text class="t" x="771" y="860" text-anchor="middle">Dispatch (Ambulance)</text><rect class="n n-admin" x="936" y="836" width="270" height="40" rx="8"/><text class="t" x="1071" y="860" text-anchor="middle">Vehicle configuration</text><text class="sub" x="1260" y="800" text-anchor="start">Not shown as arrows because they have no hand-off</text><text class="sub" x="1260" y="816" text-anchor="start">button. Every patient-linked workspace lists the same</text><text class="sub" x="1260" y="832" text-anchor="start">patient's other records under 'Connected hospital history'.</text></svg>