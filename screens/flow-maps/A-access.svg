<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 830" width="1760" height="830" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="ah"/></marker></defs><text class="title" x="24" y="32" text-anchor="start">How people get into the workspace</text><text class="sub" x="24" y="52" text-anchor="start">Every row is a real journey in the app. Orange boxes are gates, blue boxes are public pages, green boxes are inside the workspace.</text><rect class="lane-bg" x="12" y="76" width="1736" height="92" rx="12"/><text class="lane" x="28" y="126" text-anchor="start">Register a hospital</text><rect class="n n-pub" x="200" y="90" width="158" height="64" rx="8"/><text class="t" x="279" y="110" text-anchor="middle">/register</text><text class="s" x="279" y="125" text-anchor="middle">5 steps ending in</text><text class="s" x="279" y="138" text-anchor="middle">agreements</text><rect class="n n-pub" x="388" y="90" width="158" height="64" rx="8"/><text class="t" x="467" y="110" text-anchor="middle">Submitted notice</text><text class="s" x="467" y="125" text-anchor="middle">Continue to verification</text><rect class="n n-pub" x="576" y="90" width="158" height="64" rx="8"/><text class="t" x="655" y="110" text-anchor="middle">/verify</text><text class="s" x="655" y="125" text-anchor="middle">6-digit email code from</text><text class="s" x="655" y="138" text-anchor="middle">the simulated inbox</text><rect class="n n-gate" x="764" y="90" width="158" height="64" rx="8"/><text class="t" x="843" y="110" text-anchor="middle">/institutions</text><text class="s" x="843" y="125" text-anchor="middle">Choose hospital and</text><text class="s" x="843" y="138" text-anchor="middle">branch</text><rect class="n n-gate" x="952" y="90" width="158" height="64" rx="8"/><text class="t" x="1031" y="110" text-anchor="middle">/facility</text><text class="s" x="1031" y="125" text-anchor="middle">Pending review: clinical</text><text class="s" x="1031" y="138" text-anchor="middle">modules locked</text><rect class="n n-admin" x="1140" y="90" width="158" height="64" rx="8"/><text class="t" x="1219" y="110" text-anchor="middle">Platform review</text><text class="s" x="1219" y="125" text-anchor="middle">Verified: 21-day trial</text><text class="s" x="1219" y="138" text-anchor="middle">starts</text><rect class="n n-gate" x="1328" y="90" width="158" height="64" rx="8"/><text class="t" x="1407" y="110" text-anchor="middle">/onboarding</text><text class="s" x="1407" y="125" text-anchor="middle">9 setup steps, then</text><text class="s" x="1407" y="138" text-anchor="middle">Launch</text><rect class="n n-ws" x="1516" y="90" width="158" height="64" rx="8"/><text class="t" x="1595" y="110" text-anchor="middle">/dashboard</text><text class="s" x="1595" y="125" text-anchor="middle">Live hospital</text><path class="e" d="M358,122 L388,122" marker-end="url(#ah)"/><path class="e" d="M546,122 L576,122" marker-end="url(#ah)"/><path class="e" d="M734,122 L764,122" marker-end="url(#ah)"/><path class="e" d="M922,122 L952,122" marker-end="url(#ah)"/><path class="e" d="M1110,122 L1140,122" marker-end="url(#ah)"/><path class="e" d="M1298,122 L1328,122" marker-end="url(#ah)"/><path class="e" d="M1486,122 L1516,122" marker-end="url(#ah)"/><rect class="lane-bg" x="12" y="186" width="1736" height="92" rx="12"/><text class="lane" x="28" y="236" text-anchor="start">Sign in</text><rect class="n n-pub" x="200" y="200" width="158" height="64" rx="8"/><text class="t" x="279" y="220" text-anchor="middle">/signin</text><text class="s" x="279" y="235" text-anchor="middle">Email and password</text><rect class="n n-pub" x="388" y="200" width="158" height="64" rx="8"/><text class="t" x="467" y="220" text-anchor="middle">/verify</text><text class="s" x="467" y="235" text-anchor="middle">Sign-in (MFA) code</text><rect class="n n-gate" x="576" y="200" width="158" height="64" rx="8"/><text class="t" x="655" y="220" text-anchor="middle">/institutions</text><text class="s" x="655" y="235" text-anchor="middle">Choose hospital and</text><text class="s" x="655" y="248" text-anchor="middle">branch</text><rect class="n n-ws" x="764" y="200" width="158" height="64" rx="8"/><text class="t" x="843" y="220" text-anchor="middle">/dashboard</text><text class="s" x="843" y="235" text-anchor="middle">Or the last page you</text><text class="s" x="843" y="248" text-anchor="middle">used</text><path class="e" d="M358,232 L388,232" marker-end="url(#ah)"/><path class="e" d="M546,232 L576,232" marker-end="url(#ah)"/><path class="e" d="M734,232 L764,232" marker-end="url(#ah)"/><rect class="lane-bg" x="12" y="296" width="1736" height="92" rx="12"/><text class="lane" x="28" y="346" text-anchor="start">Forgot password</text><rect class="n n-pub" x="200" y="310" width="158" height="64" rx="8"/><text class="t" x="279" y="330" text-anchor="middle">/signin</text><text class="s" x="279" y="345" text-anchor="middle">Forgot password link</text><rect class="n n-pub" x="388" y="310" width="158" height="64" rx="8"/><text class="t" x="467" y="330" text-anchor="middle">/recover</text><text class="s" x="467" y="345" text-anchor="middle">Email or phone</text><rect class="n n-pub" x="576" y="310" width="158" height="64" rx="8"/><text class="t" x="655" y="330" text-anchor="middle">Neutral notice</text><text class="s" x="655" y="345" text-anchor="middle">Does not reveal if the</text><text class="s" x="655" y="358" text-anchor="middle">account exists</text><rect class="n n-pub" x="764" y="310" width="158" height="64" rx="8"/><text class="t" x="843" y="330" text-anchor="middle">/verify</text><text class="s" x="843" y="345" text-anchor="middle">Recovery code</text><rect class="n n-pub" x="952" y="310" width="158" height="64" rx="8"/><text class="t" x="1031" y="330" text-anchor="middle">/reset-password</text><text class="s" x="1031" y="345" text-anchor="middle">Replace password; other</text><text class="s" x="1031" y="358" text-anchor="middle">sessions end</text><rect class="n n-pub" x="1140" y="310" width="158" height="64" rx="8"/><text class="t" x="1219" y="330" text-anchor="middle">/signin</text><text class="s" x="1219" y="345" text-anchor="middle">Sign in with the new</text><text class="s" x="1219" y="358" text-anchor="middle">password</text><path class="e" d="M358,342 L388,342" marker-end="url(#ah)"/><path class="e" d="M546,342 L576,342" marker-end="url(#ah)"/><path class="e" d="M734,342 L764,342" marker-end="url(#ah)"/><path class="e" d="M922,342 L952,342" marker-end="url(#ah)"/><path class="e" d="M1110,342 L1140,342" marker-end="url(#ah)"/><rect class="lane-bg" x="12" y="406" width="1736" height="92" rx="12"/><text class="lane" x="28" y="456" text-anchor="start">Staff invitation</text><rect class="n n-admin" x="200" y="420" width="158" height="64" rx="8"/><text class="t" x="279" y="440" text-anchor="middle">Staff &amp; access</text><text class="s" x="279" y="455" text-anchor="middle">Owner or Admin sends an</text><text class="s" x="279" y="468" text-anchor="middle">invitation</text><rect class="n n-pub" x="388" y="420" width="158" height="64" rx="8"/><text class="t" x="467" y="440" text-anchor="middle">/invitation/:id</text><text class="s" x="467" y="455" text-anchor="middle">Signed out: Sign in or</text><text class="s" x="467" y="468" text-anchor="middle">Create account</text><rect class="n n-pub" x="576" y="420" width="158" height="64" rx="8"/><text class="t" x="655" y="440" text-anchor="middle">/register?invite</text><text class="s" x="655" y="455" text-anchor="middle">Create staff account (or</text><text class="s" x="655" y="468" text-anchor="middle">/signin?invite)</text><rect class="n n-pub" x="764" y="420" width="158" height="64" rx="8"/><text class="t" x="843" y="440" text-anchor="middle">/verify</text><text class="s" x="843" y="455" text-anchor="middle">Email code</text><rect class="n n-pub" x="952" y="420" width="158" height="64" rx="8"/><text class="t" x="1031" y="440" text-anchor="middle">/invitation/:id</text><text class="s" x="1031" y="455" text-anchor="middle">Signed in: Accept</text><text class="s" x="1031" y="468" text-anchor="middle">assigned membership</text><rect class="n n-gate" x="1140" y="420" width="158" height="64" rx="8"/><text class="t" x="1219" y="440" text-anchor="middle">/institutions</text><text class="s" x="1219" y="455" text-anchor="middle">New membership appears</text><rect class="n n-admin" x="1328" y="420" width="158" height="64" rx="8"/><text class="t" x="1407" y="440" text-anchor="middle">/profile</text><text class="s" x="1407" y="455" text-anchor="middle">Forced password change</text><text class="s" x="1407" y="468" text-anchor="middle">on first login</text><rect class="n n-ws" x="1516" y="420" width="158" height="64" rx="8"/><text class="t" x="1595" y="440" text-anchor="middle">/dashboard</text><text class="s" x="1595" y="455" text-anchor="middle">Role-scoped home</text><path class="e" d="M358,452 L388,452" marker-end="url(#ah)"/><path class="e" d="M546,452 L576,452" marker-end="url(#ah)"/><path class="e" d="M734,452 L764,452" marker-end="url(#ah)"/><path class="e" d="M922,452 L952,452" marker-end="url(#ah)"/><path class="e" d="M1110,452 L1140,452" marker-end="url(#ah)"/><path class="e" d="M1298,452 L1328,452" marker-end="url(#ah)"/><path class="e" d="M1486,452 L1516,452" marker-end="url(#ah)"/><rect class="lane-bg" x="12" y="516" width="1736" height="92" rx="12"/><text class="lane" x="28" y="566" text-anchor="start">Inside a workspace</text><rect class="n n-ws" x="200" y="530" width="158" height="64" rx="8"/><text class="t" x="279" y="550" text-anchor="middle">/dashboard</text><text class="s" x="279" y="565" text-anchor="middle">Role-specific work list</text><text class="s" x="279" y="578" text-anchor="middle">and shortcuts</text><rect class="n n-ws" x="388" y="530" width="158" height="64" rx="8"/><text class="t" x="467" y="550" text-anchor="middle">/:module</text><text class="s" x="467" y="565" text-anchor="middle">List: search, Quick</text><text class="s" x="467" y="578" text-anchor="middle">view, Open</text><rect class="n n-ws" x="576" y="530" width="158" height="64" rx="8"/><text class="t" x="655" y="550" text-anchor="middle">/:module/new</text><text class="s" x="655" y="565" text-anchor="middle">Create form (if role may</text><text class="s" x="655" y="578" text-anchor="middle">create)</text><rect class="n n-ws" x="764" y="530" width="158" height="64" rx="8"/><text class="t" x="843" y="550" text-anchor="middle">/:module/:id</text><text class="s" x="843" y="565" text-anchor="middle">Record detail and</text><text class="s" x="843" y="578" text-anchor="middle">available actions</text><rect class="n n-ws" x="952" y="530" width="158" height="64" rx="8"/><text class="t" x="1031" y="550" text-anchor="middle">Action form</text><text class="s" x="1031" y="565" text-anchor="middle">Fields for the chosen</text><text class="s" x="1031" y="578" text-anchor="middle">transition</text><rect class="n n-gate" x="1140" y="530" width="158" height="64" rx="8"/><text class="t" x="1219" y="550" text-anchor="middle">Confirm dialog</text><text class="s" x="1219" y="565" text-anchor="middle">Typed word for sign,</text><text class="s" x="1219" y="578" text-anchor="middle">refund, void, cancel</text><rect class="n n-ws" x="1328" y="530" width="158" height="64" rx="8"/><text class="t" x="1407" y="550" text-anchor="middle">Saved</text><text class="s" x="1407" y="565" text-anchor="middle">New status + version</text><text class="s" x="1407" y="578" text-anchor="middle">history entry</text><path class="e" d="M358,562 L388,562" marker-end="url(#ah)"/><path class="e" d="M546,562 L576,562" marker-end="url(#ah)"/><path class="e" d="M734,562 L764,562" marker-end="url(#ah)"/><path class="e" d="M922,562 L952,562" marker-end="url(#ah)"/><path class="e" d="M1110,562 L1140,562" marker-end="url(#ah)"/><path class="e" d="M1298,562 L1328,562" marker-end="url(#ah)"/><rect class="lane-bg" x="12" y="646" width="1736" height="150" rx="12"/><text class="lane" x="28" y="666" text-anchor="start">Route guard on every page</text><text class="sub" x="330" y="666" text-anchor="start">Checked in this order whenever the address changes (app.tsx).</text><rect class="n n-bad" x="28" y="684" width="270" height="76" rx="8"/><text class="t" x="163" y="704" text-anchor="middle">1. No session</text><text class="s" x="163" y="719" text-anchor="middle">Go to /signin</text><rect class="n n-bad" x="314" y="684" width="270" height="76" rx="8"/><text class="t" x="449" y="704" text-anchor="middle">2. No active membership</text><text class="s" x="449" y="719" text-anchor="middle">Go to /institutions</text><path class="e" d="M298,722 L314,722" marker-end="url(#ah)"/><rect class="n n-bad" x="600" y="684" width="270" height="76" rx="8"/><text class="t" x="735" y="704" text-anchor="middle">3. Forced password change</text><text class="s" x="735" y="719" text-anchor="middle">Go to /profile</text><path class="e" d="M584,722 L600,722" marker-end="url(#ah)"/><rect class="n n-bad" x="886" y="684" width="270" height="76" rx="8"/><text class="t" x="1021" y="704" text-anchor="middle">4. Facility pending review</text><text class="s" x="1021" y="719" text-anchor="middle">Only /facility, /staff, /subscription,</text><text class="s" x="1021" y="732" text-anchor="middle">/dashboard</text><path class="e" d="M870,722 L886,722" marker-end="url(#ah)"/><rect class="n n-bad" x="1172" y="684" width="270" height="76" rx="8"/><text class="t" x="1307" y="704" text-anchor="middle">5. Hospital not launched</text><text class="s" x="1307" y="719" text-anchor="middle">Only setup pages: onboarding, staff,</text><text class="s" x="1307" y="732" text-anchor="middle">shifts, services, setup, facility,</text><text class="s" x="1307" y="745" text-anchor="middle">subscription, dashboard</text><path class="e" d="M1156,722 L1172,722" marker-end="url(#ah)"/><rect class="n n-bad" x="1458" y="684" width="270" height="76" rx="8"/><text class="t" x="1593" y="704" text-anchor="middle">6. Permission missing</text><text class="s" x="1593" y="719" text-anchor="middle">Go to /dashboard with a notice</text><path class="e" d="M1442,722 L1458,722" marker-end="url(#ah)"/><text class="sub" x="28" y="784" text-anchor="start">Dev-only pages reachable without a session: /simulation (simulated inbox, sample data, dev clock) and /patient-simulation (consent simulator).</text></svg>